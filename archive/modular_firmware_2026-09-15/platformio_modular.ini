; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = .pio-core

[env:esp32-s3-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ============================================================
; FACTORY BRING-UP MODE
; Fokus firmware ini: test hardware satu per satu dari Web UI.
; Integrasi berat seperti MQTT dan cloud TTS dimatikan dulu supaya ESP32-S3
; tidak sibuk dengan koneksi internet, publish state, dan task background.
; Nanti setelah semua modul stabil, MQTT/TTS bisa diaktifkan lagi.
; ============================================================
build_flags =
	; WiFi AP/STA. Matikan hanya jika tidak butuh Web UI dan MQTT.
	-D ACTIVATE_WIFI_MODULE=1
	; Web UI lokal.
	-D ACTIVATE_WEB_MODULE=1
	; MQTT control/state. OFF dulu saat bring-up hardware.
	-D ACTIVATE_MQTT_MODULE=0
	; IR receiver/transmitter AC.
	-D ACTIVATE_IR_MODULE=1
	; OLED SSD1306.
	-D ACTIVATE_OLED_MODULE=1
	; Modbus RTU RS485 energy meter.
	-D ACTIVATE_MODBUS_MODULE=1
	; Microphone I2S.
	-D ACTIVATE_MIC_MODULE=1
	; Test suara lokal MAX98357A.
	-D ACTIVATE_SPEAKER_MODULE=1
	; Text-to-speech Wit.ai lewat MAX98357A. OFF dulu; speaker lokal tetap aktif.
	-D ACTIVATE_TTS_MODULE=0
	; ============================================================
	; USER CONFIG / DEBUG SWITCHES
	; Ubah angka 1 menjadi 0 untuk mematikan log Serial per modul.
	; Contoh:
	;   -D ENABLE_MODBUS_LOGS=0  ; Modbus tidak spam raw register
	;   -D ENABLE_MIC_LOGS=1     ; Mic tetap tampil di Serial monitor
	; ============================================================
	; Log boot saat ESP32 menyala.
	-D ENABLE_BOOT_LOGS=1
	; Log pembacaan Modbus RTU energy meter, termasuk raw register.
	-D ENABLE_MODBUS_LOGS=1
	; Log aktivitas IR receiver/transmitter dan hasil decode IR.
	-D ENABLE_IR_LOGS=0
	; Log level microphone I2S/RMS per interval.
	-D ENABLE_MIC_LOGS=0
	; Log amplifier/speaker MAX98357A dan test lokal.
	-D ENABLE_AMPLIFIER_LOGS=0
	; Log koneksi/payload MQTT.
	-D ENABLE_MQTT_LOGS=0
	; Log koneksi WiFi STA.
	-D ENABLE_WIFI_LOGS=0
	; Log OLED init/status.
	-D ENABLE_OLED_LOGS=1
	; Log TTS cloud/Wit.ai.
	-D ENABLE_TTS_LOGS=0
lib_deps = 
	adafruit/Adafruit NeoPixel @ ^1.12.3
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit SSD1306 @ ^2.5.13
